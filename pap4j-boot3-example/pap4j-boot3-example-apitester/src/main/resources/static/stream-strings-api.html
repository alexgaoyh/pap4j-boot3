<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title></title>
</head>
<body>
<div id="app">
    <div>
        <textarea type="text" v-model="fullContent" rows="20" cols="100"></textarea>
    </div>
</div>
</body>
<script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/axios@1.17.0/dist/axios.min.js"></script>
<script>
    new Vue({
        el: '#app',
        data: {
            eventSource: null,
            fullContent: '',
            displayedContent: '',
            typingTimer: null,
            typingIndex: 0
        },
        created() {
            this.startStream();
        },
        methods: {
            startStream() {
                const eventSource = new EventSource("http://localhost:8080/stream-strings-api");
                eventSource.onmessage = (event) => {
                    const message = event.data;
                    this.printCharacters(message);
                };

                // 监听自定义结束事件
                eventSource.addEventListener("end", () => {
                    this.completed = true; // 更新状态为完成
                    eventSource.close(); // 关闭连接
                });

                eventSource.onerror = () => {
                    console.error("连接错误，关闭流。");
                    eventSource.close();
                };
            },
            async printCharacters(message) {
                for (const char of message) {
                    await this.delay(10); // 模拟逐字打印延迟
                    this.fullContent += char;
                }
                this.fullContent += "\n"; // 添加换行符，确保每条消息单独显示
            },
            delay(ms) {
                return new Promise((resolve) => setTimeout(resolve, ms));
            },
        },
        beforeDestroy() {
            if (this.eventSource) {
                this.eventSource.close();
            }
            if (this.typingTimer) {
                clearInterval(this.typingTimer);
            }
        }
    });
</script>
</html>
