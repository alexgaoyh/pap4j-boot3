spring:
  autoconfigure:
    exclude:
      - org.springframework.ai.vectorstore.elasticsearch.autoconfigure.ElasticsearchVectorStoreAutoConfiguration
  ai:
    chat:
      client:
        enabled: false # 按照 Spring AI 官方文档：使用多个 ChatClient 时禁用单一默认自动配置，由配置类手动声明多个 Bean
    openai:
      api-key: "dummy-key-to-bypass-starter-validation" # 哑值：用于绕过未使用 OpenAI Starter 自动装配 Bean 的启动 API-Key 强校验
    model:
      embedding: none # 关闭默认的 ONNX 向量自动装配，防止启动时从 GitHub 自动下载模型权重
    vectorstore:
      elasticsearch:
        enabled: false # 关闭官方默认装配，防止其在 Simple 模式下自作聪明

# 自定义配置：知识库文件目录和向量存储位置, 多模型配置：主大模型与极速改写小模型全量参数物理隔离
ai:
  knowledge:
    docs-location: classpath:/knowledge/docs/
    vector-store-path: ${java.io.tmpdir}/pap4j-boot3-example-spring-ai/vector
    store-type: simple # simple | elasticsearch
  elasticsearch:
    uris: http://192.168.1.115:9200
    username: "elastic"
    password: "alexgaoyh"
  assistant:
    persona: Java 开发架构师

  # 1. 答案生成主大模型 (Main LLM) 专属配置 (支持 ollama / openai)
  main-llm:
    provider: ollama
    base-url: http://example.com
    api-key: ""
    model: llama3.1
    # 采样温度 (0.0 ~ 1.0)：
    # - 默认 0.7：适合日常对话交互，兼顾回答的多样性与语言自然度。
    # - 评测/测试建议 0（或 0.1）：进入贪心解码（Greedy Decoding）模式，消除采样随机抖动（Sampling Jitter）。
    #   在兼具常识先验与专有知识库的场景下，设为 0 可确保“直接作答”与“调用检索工具”的决策完全幂等且可复现，
    #   避免批跑评测（如 AgentEvaluationTest）时因概率抽样出现偶发跳过工具调用的漂移现象。
    temperature: 0

  # 2. 极速小模型 Query 改写专属配置 (支持 ollama / openai)
  rewrite-slm:
    provider: ollama
    base-url: https://example.com
    api-key: ""
    model: llama3.1
    temperature: 0.1

  # 3. 向量化模型动态配置 (支持 onnx / ollama / openai)
  # Ollama 的后台服务会自动进行按需加载。当它接收到包含 "model": "bge-m3" 的 API 请求时，会自动把 bge-m3 装载进显存/内存并计算，只需要提前 pull 即可。
  embedding-model:
    provider: onnx
    base-url: https://example.com
    api-key: ""
    model: bge-m3
    onnx:
      model-uri: classpath:/onnx/model.onnx
      tokenizer-uri: classpath:/onnx/tokenizer.json