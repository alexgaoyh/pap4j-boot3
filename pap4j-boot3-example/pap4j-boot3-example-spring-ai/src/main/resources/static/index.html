<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 智能助手 - 增强版</title>
    <!-- 引入 Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 github-markdown-css 用于渲染 Markdown 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown.min.css">
    <!-- 引入 marked 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 highlight.js (使用全量或常用语言包) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <!-- 引入 KaTeX 数学渲染（LaTeX 公式）：CSS + JS + marked 数学扩展（先 katex JS 后扩展，扩展依赖 global.katex） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.10/lib/index.umd.js"></script>
    <style>
        body { height: 100vh; margin: 0; display: flex; font-family: sans-serif; }
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; background: #ffffff; }
        .chat-header { padding: 12px 20px; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; font-size: 1.2rem; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .message.user { align-self: flex-end; background-color: #4f46e5; color: white; white-space: pre-wrap; }
        .message.bot { align-self: flex-start; background-color: #f1f5f9; border: 1px solid #e2e8f0; }
        .markdown-body { background-color: transparent !important; font-family: inherit !important; font-size: 0.95rem !important; }
        .markdown-body p:last-child { margin-bottom: 0 !important; }
        .code-block-wrapper { margin: 8px 0; border-radius: 6px; overflow: hidden; background: #282c34; }
        .code-header { display: flex; justify-content: space-between; padding: 4px 8px; background: #21252b; color: #abb2bf; font-size: 0.75rem; }
        .copy-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #abb2bf; font-size: 0.7rem; border-radius: 3px; cursor: pointer; }
        .code-block-wrapper pre { margin: 0 !important; padding: 10px !important; background: transparent !important; }
        .code-block-wrapper code { background: transparent !important; padding: 0 !important; }
        .chat-input-area { padding: 12px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; }
        #promptInput { flex: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 20px; outline: none; }
        #sendBtn { width: 38px; height: 38px; background-color: #4f46e5; color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #sendBtn:disabled { background-color: #e2e8f0; color: #94a3b8; }
        .cursor { display: inline-block; width: 2px; height: 1.2em; background-color: #4f46e5; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }

        /* 思考过程样式 (DeepSeek Think 增量增强) */
        .think-container { margin: 8px 0; background: #f8fafc; border: 1px solid #e2e8f0; border-left: 3px solid #6366f1; border-radius: 6px; overflow: hidden; font-size: 0.88rem; }
        .think-container summary { list-style: none; }
        .think-container summary::-webkit-details-marker { display: none; }
        .think-header { display: flex; align-items: center; gap: 8px; padding: 6px 10px; background: #f1f5f9; color: #475569; font-weight: 500; cursor: pointer; user-select: none; }
        .think-header:hover { background: #e2e8f0; }
        .think-body { padding: 8px 12px; color: #64748b; line-height: 1.6; border-top: 1px dashed #e2e8f0; max-height: 300px; overflow-y: auto; overscroll-behavior: contain; font-family: ui-monospace, SFMono-Regular, monospace; background: #fafafa; }
        .think-body p { margin: 2px 0 !important; }
        .think-spinner { display: inline-block; width: 12px; height: 12px; border: 2px solid #cbd5e1; border-top-color: #6366f1; border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .think-placeholder { display: flex; align-items: center; gap: 6px; color: #64748b; font-size: 0.88rem; }
    </style>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Spring AI 智能助手</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot"><div class="message-content markdown-body">你好！</div></div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="promptInput" placeholder="输入问题..." autocomplete="off"/>
        <button id="sendBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    const languageAliasMap = {
        'ql': 'javascript',
        'jsonpath': 'json',
        'expr': 'java',
        'text': 'plaintext'
    };

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Markdown 预处理器：规范换行符并在表格行（|）与上方未空行的文本块之间自动插入空行
    function preprocessMarkdown(text) {
        if (!text) return '';
        // 1. 规范化所有回车换行符为 \n
        const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const lines = normalized.split('\n');
        const processedLines = [];
        
        for (let i = 0; i < lines.length; i++) {
            const currentLine = lines[i];
            const trimmedCurrent = currentLine.trim();
            
            // 如果当前行是以 '|' 开头且前面有一行不是空行、也不以 '|' 开头，则强行加一个空行
            if (trimmedCurrent.startsWith('|')) {
                if (i > 0) {
                    const prevLine = processedLines[processedLines.length - 1];
                    const trimmedPrev = prevLine.trim();
                    if (trimmedPrev !== '' && !trimmedPrev.startsWith('|')) {
                        processedLines.push('');
                    }
                }
            }
            processedLines.push(currentLine);
        }
        return processedLines.join('\n');
    }

    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
        let codeText = typeof code === 'object' ? (code.text || '') : code;
        let codeLang = typeof code === 'object' ? (code.lang || language) : language;

        if (typeof codeText !== 'string') {
            codeText = String(codeText || '');
        }

        const hasHljs = typeof window.hljs !== 'undefined';
        const targetLang = languageAliasMap[codeLang?.toLowerCase()] || codeLang;
        let highlighted;
        const validLang = !!(hasHljs && targetLang && window.hljs.getLanguage(targetLang));

        try {
            if (validLang && hasHljs) {
                highlighted = window.hljs.highlight(codeText, { language: targetLang }).value;
            } else if (hasHljs) {
                highlighted = window.hljs.highlightAuto(codeText).value;
            } else {
                highlighted = escapeHtml(codeText);
            }
        } catch (e) {
            highlighted = escapeHtml(codeText);
        }

        const displayLang = codeLang || 'text';

        return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>${displayLang}</span>
                    <button class="copy-btn" onclick="copyCode(this)">复制</button>
                </div>
                <pre><code class="hljs ${validLang ? 'language-' + targetLang : ''}">${highlighted}</code></pre>
            </div>
        `;
    };

    marked.use({ renderer: renderer, breaks: true, gfm: true });

    // 注册 KaTeX 数学渲染扩展（tokenizer 级，先于其他 inline 规则整块捕获 $...$ / $$...$$，避免 LaTeX 反斜杠被 marked 转义破坏）
    // throwOnError:false → 流式过程中遇到不完整/非法公式时渲染原文，不抛异常中断聊天
    if (typeof markedKatex !== 'undefined') {
        marked.use(markedKatex({ throwOnError: false }));
    }

    function copyCode(btn) {
        const code = btn.parentElement.nextElementSibling.innerText;
        navigator.clipboard.writeText(code).then(() => {
            const oldText = btn.innerText;
            btn.innerText = '已复制!';
            setTimeout(() => btn.innerText = oldText, 2000);
        });
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        const contentDiv = document.createElement('div');
        contentDiv.className = sender === 'bot' ? 'message-content markdown-body' : 'message-content';
        if (sender === 'bot') contentDiv.innerHTML = marked.parse(preprocessMarkdown(text));
        else contentDiv.textContent = text;
        msgDiv.appendChild(contentDiv);
        chatMessages.appendChild(msgDiv);
        stickChatToBottom();
        return contentDiv;
    }

    // 后端实际输出的是 <thinking>...</thinking>（也兼容 <think>），且一次回答里可能出现多个思考块，
    // 这里统一按“answer / thinking”片段解析，避免标签被当成未知 HTML 元素直接平铺显示。
    const THINK_TAG_RE = /<think(?:ing)?\s*>([\s\S]*?)(<\/think(?:ing)?\s*>|$)/gi;
    const THINK_OPEN_TAGS = ['<think>', '<thinking>'];
    const THINK_CLOSE_TAGS = ['</think>', '</thinking>'];

    /**
     * 流式过程中末尾可能是半个标签（例如 "<thinki"），先隐藏掉，避免界面上闪现原始标签
     */
    function stripPartialThinkTag(text) {
        const idx = text.lastIndexOf('<');
        if (idx === -1) return text;
        const tail = text.slice(idx).toLowerCase();
        if (tail.includes('>')) return text;
        const candidates = THINK_OPEN_TAGS.concat(THINK_CLOSE_TAGS);
        return candidates.some(tag => tag.startsWith(tail)) ? text.slice(0, idx) : text;
    }

    /**
     * 把文本切成 answer / thinking 片段，支持多个思考块与未闭合的思考块
     */
    function splitThinkSegments(text) {
        const segments = [];
        let lastIndex = 0;
        let match;
        THINK_TAG_RE.lastIndex = 0;
        while ((match = THINK_TAG_RE.exec(text)) !== null) {
            if (match.index > lastIndex) {
                segments.push({ type: 'answer', text: text.slice(lastIndex, match.index) });
            }
            segments.push({ type: 'thinking', text: match[1], closed: !!match[2] });
            lastIndex = THINK_TAG_RE.lastIndex;
            if (match[0].length === 0) {
                THINK_TAG_RE.lastIndex++;
            }
        }
        if (lastIndex < text.length) {
            segments.push({ type: 'answer', text: text.slice(lastIndex) });
        }
        return segments;
    }

    // ===== 滚动跟随（粘性贴底）+ 原地更新 =====
    // 关键点：
    // 1) 只有用户本来就贴底时才自动跟随新内容；用户手动上翻后不再被强行拽回底部；
    // 2) 流式更新时复用思考块的 DOM 节点（只替换内部 HTML），否则滚动容器每帧被销毁重建，
    //    会导致 scrollTop 归零、滚动条无法拖动。
    const STICKY_TOLERANCE = 24;
    const CURSOR_HTML = '<span class="cursor"></span>';

    function isNearBottom(el) {
        if (!el) return true;
        return el.scrollHeight - el.scrollTop - el.clientHeight <= STICKY_TOLERANCE;
    }

    function scrollToBottom(el) {
        if (!el) return;
        // 标记为“程序自动滚动”，避免自己的滚动被当成用户上翻（scroll 事件是本帧内异步派发的）
        el.__piAutoScroll = true;
        el.scrollTop = el.scrollHeight;
        requestAnimationFrame(() => { el.__piAutoScroll = false; });
    }

    // 主动跟随时显式复位跟随标记（避免上一轮用户上翻留下的 false 影响新一轮）
    function stickChatToBottom() {
        chatFollowSticky = true;
        scrollToBottom(chatMessages);
    }

    // 仅在“用户仍处于贴底状态”时才跟随，并在下一帧校正一次（字体/公式排版延迟会改变高度）
    function followChatIfSticky() {
        if (!chatFollowSticky) return;
        scrollToBottom(chatMessages);
        requestAnimationFrame(() => {
            if (chatFollowSticky) scrollToBottom(chatMessages);
        });
    }

    // 会话区是否跟随到底部：由用户实际滚动行为决定，而不是每帧根据布局推断
    let chatFollowSticky = true;
    chatMessages.addEventListener('scroll', () => {
        if (chatMessages.__piAutoScroll) return;
        chatFollowSticky = isNearBottom(chatMessages);
    }, { passive: true });

    function elapsedSeconds(startTime) {
        return startTime ? Math.max(1, Math.round((Date.now() - startTime) / 1000)) : 0;
    }

    // 每个消息容器 -> { sig: 结构签名, follow: 思考块是否贴底, open: 已完成块是否展开 }
    const renderStates = new WeakMap();

    function getRenderState(container) {
        let state = renderStates.get(container);
        if (!state) {
            state = { sig: '', follow: [], open: [] };
            renderStates.set(container, state);
            // scroll 不冒泡，用捕获阶段监听思考块自身的滚动，实时记录用户是否贴底
            container.addEventListener('scroll', (event) => {
                const body = event.target;
                if (!body || !body.classList || !body.classList.contains('think-body')) return;
                if (body.__piAutoScroll) return;
                const index = Number(body.dataset.thinkIndex);
                if (Number.isNaN(index)) return;
                const current = renderStates.get(container);
                if (current) current.follow[index] = isNearBottom(body);
            }, true);
            container.addEventListener('toggle', (event) => {
                const details = event.target;
                if (!details || details.tagName !== 'DETAILS') return;
                const index = Number(details.dataset.thinkIndex);
                if (Number.isNaN(index)) return;
                const current = renderStates.get(container);
                if (current) current.open[index] = details.open;
            }, true);
        }
        return state;
    }

    function createThinkBlock(segment, index) {
        const node = document.createElement(segment.closed ? 'details' : 'div');
        node.className = 'think-container ' + (segment.closed ? 'completed' : 'in-progress');
        node.dataset.thinkIndex = String(index);
        if (segment.closed) {
            node.open = true;
            node.innerHTML = `
                <summary class="think-header">
                    <span>💭</span>
                    <span class="think-label"></span>
                    <span style="margin-left: auto; font-size: 0.75rem; color: #94a3b8;">点击展开/折叠</span>
                </summary>
                <div class="think-body markdown-body" data-think-index="${index}"></div>`;
        } else {
            node.innerHTML = `
                <div class="think-header">
                    <span class="think-spinner"></span>
                    <span class="think-label"></span>
                </div>
                <div class="think-body markdown-body" data-think-index="${index}"></div>`;
        }
        return node;
    }

    function updateThinkBlock(node, segment, index, isStreaming, seconds, state) {
        const body = node.querySelector('.think-body');
        const label = node.querySelector('.think-label');
        if (!body) return;
        if (label) {
            label.textContent = segment.closed
                ? `已完成思考 (用时 ${seconds} 秒)`
                : `正在思考... (${seconds}s)`;
        }
        const sticky = state.follow[index] !== false;
        const prevTop = body.scrollTop;
        body.innerHTML = marked.parse(preprocessMarkdown(segment.text))
            + (!segment.closed && isStreaming ? CURSOR_HTML : '');
        // 内容变高后：贴底的继续贴底跟随，否则保持用户自己拖动到的位置
        if (sticky) {
            scrollToBottom(body);
            // 字体 / KaTeX 排版可能在本次渲染之后才改变高度，下一帧再校正一次
            requestAnimationFrame(() => {
                if (state.follow[index] !== false) scrollToBottom(body);
            });
        } else {
            body.scrollTop = prevTop;
        }
    }

    /**
     * 渲染到消息容器：
     * - 思考块 / 回答段按片段复用 DOM，结构不变时只更新内容（滚动条可正常拖动）
     * - 结构变化（思考开始/结束、出现回答段）时才重建，并沿用展开状态与贴底状态
     */
    function renderIntoMessage(container, text, isStreaming, startTime) {
        const visibleText = text ? stripPartialThinkTag(text) : '';
        const segments = visibleText ? splitThinkSegments(visibleText) : [];
        const state = getRenderState(container);
        const seconds = elapsedSeconds(startTime);

        if (!segments.some(segment => segment.type === 'thinking')) {
            // 没有思考块：整段 Markdown 直出
            state.sig = '';
            state.follow = [];
            container.innerHTML = visibleText ? marked.parse(preprocessMarkdown(visibleText)) : '';
            if (isStreaming) container.insertAdjacentHTML('beforeend', CURSOR_HTML);
            followChatIfSticky();
            return;
        }

        const sig = segments.map(segment => segment.type === 'thinking'
            ? (segment.closed ? 'T1' : 'T0')
            : 'A').join(',');

        if (state.sig !== sig) {
            const prevOpen = state.open.slice();
            // DOM 将被重建，旧节点上的滚动位置/跟随状态已无意义：新节点统一从“跟随底部”开始
            state.follow = segments.map(() => true);
            container.innerHTML = '';
            segments.forEach((segment, index) => {
                if (segment.type === 'answer') {
                    const answer = document.createElement('div');
                    answer.className = 'seg-answer';
                    container.appendChild(answer);
                } else {
                    const node = createThinkBlock(segment, index);
                    if (segment.closed && prevOpen[index] === false) {
                        node.open = false;
                    }
                    container.appendChild(node);
                }
            });
            state.sig = sig;
        }

        segments.forEach((segment, index) => {
            const node = container.children[index];
            if (!node) return;
            if (segment.type === 'answer') {
                const answerText = segment.text.trim();
                let html = answerText ? marked.parse(preprocessMarkdown(answerText)) : '';
                if (isStreaming && index === segments.length - 1) html += CURSOR_HTML;
                node.innerHTML = html;
            } else {
                updateThinkBlock(node, segment, index, isStreaming, seconds, state);
            }
        });

        followChatIfSticky();
    }

    const chatId = 'chat-' + Math.random().toString(36).substr(2, 9);

    async function sendPrompt() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        appendMessage('user', prompt);
        promptInput.value = '';
        sendBtn.disabled = true;
        promptInput.disabled = true;

        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'message bot';
        const botContentDiv = document.createElement('div');
        botContentDiv.className = 'message-content markdown-body';
        botContentDiv.innerHTML = '<div class="think-placeholder"><span class="think-spinner"></span> 正在思考...</div>';
        botMsgDiv.appendChild(botContentDiv);
        chatMessages.appendChild(botMsgDiv);
        stickChatToBottom();

        const startTime = Date.now();
        let fullResponse = '';
        let errorMessage = '';

        try {
            const response = await fetch('/api/ai/agent/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, chatId })
            });
            if (!response.ok) throw new Error('网络请求失败');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let eventLines = [];
            let hasData = false;

            // 完美的流式行和多行事件缓冲区解析，符合 W3C SSE 规范，确保还原 Markdown 换行与表格
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                let lineIndex;
                while ((lineIndex = buffer.indexOf('\n')) !== -1) {
                    const line = buffer.slice(0, lineIndex);
                    buffer = buffer.slice(lineIndex + 1);

                    // 兼容 Windows 系统的回车符 \r
                    const cleanLine = line.replace(/\r$/, '');
                    if (cleanLine.startsWith('data:')) {
                        hasData = true;
                        let content = cleanLine.slice(5);
                        if (content.startsWith(' ')) {
                            content = content.slice(1);
                        }
                        try {
                            const parsed = JSON.parse(content);
                            eventLines.push(parsed.v);
                        } catch (e) {
                            eventLines.push(content);
                        }
                    } else if (cleanLine === '') {
                        if (hasData) {
                            // 一个完整的 SSE 事件块结束，将其包含的行拼接加入 fullResponse
                            fullResponse += eventLines.join('\n');
                            eventLines = [];
                            hasData = false;
                        }
                    }
                }

                // 实时打字机渲染（包含当前正在拼接缓冲的数据，提供流畅的打字效果）
                // 滚动跟随交给 renderIntoMessage 内部处理，避免无条件拉回底部导致用户无法上翻
                const tempResponse = fullResponse + (hasData ? eventLines.join('\n') : '');
                renderIntoMessage(botContentDiv, tempResponse, true, startTime);
            }

            // 处理流结束后的可能残余缓冲区数据
            if (buffer.length > 0) {
                const cleanLine = buffer.replace(/\r$/, '');
                if (cleanLine.startsWith('data:')) {
                    hasData = true;
                    let content = cleanLine.slice(5);
                    if (content.startsWith(' ')) {
                        content = content.slice(1);
                    }
                    try {
                        const parsed = JSON.parse(content);
                        eventLines.push(parsed.v);
                    } catch (e) {
                        eventLines.push(content);
                    }
                }
            }
            if (hasData && eventLines.length > 0) {
                fullResponse += eventLines.join('\n');
                eventLines = [];
                hasData = false;
            }

        } catch (error) {
            errorMessage = error && error.message ? error.message : String(error);
        } finally {
            if (errorMessage) {
                botContentDiv.innerHTML = '<div class="think-placeholder">⚠️ 请求失败：' + escapeHtml(errorMessage) + '</div>';
                if (fullResponse) {
                    const restDiv = document.createElement('div');
                    botContentDiv.appendChild(restDiv);
                    renderIntoMessage(restDiv, fullResponse, false, startTime);
                }
            } else {
                renderIntoMessage(botContentDiv, fullResponse, false, startTime);
            }
            sendBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendPrompt);
    promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendPrompt(); });
</script>

</body>
</html>
