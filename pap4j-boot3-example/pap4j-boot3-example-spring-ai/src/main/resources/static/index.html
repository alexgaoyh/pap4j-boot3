<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 流式对话示例</title>
    <style>
        :root {
            --bg-color: #f5f7f9;
            --chat-bg: #ffffff;
            --primary-color: #007bff;
            --text-color: #333333;
            --bot-bubble: #f0f0f0;
            --user-bubble: #007bff;
            --user-text: #ffffff;
            --border-color: #e0e0e0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .chat-container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background-color: var(--chat-bg);
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .chat-header {
            padding: 20px;
            background-color: var(--chat-bg);
            border-bottom: 1px solid var(--border-color);
            text-align: center;
            font-size: 1.2rem;
            font-weight: 600;
        }

        .chat-messages {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 12px;
            line-height: 1.5;
            word-wrap: break-word;
            white-space: pre-wrap;
        }

        .message.user {
            align-self: flex-end;
            background-color: var(--user-bubble);
            color: var(--user-text);
            border-bottom-right-radius: 4px;
        }

        .message.bot {
            align-self: flex-start;
            background-color: var(--bot-bubble);
            color: var(--text-color);
            border-bottom-left-radius: 4px;
        }

        .chat-input-area {
            padding: 16px 20px;
            background-color: var(--chat-bg);
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        #promptInput {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid var(--border-color);
            border-radius: 24px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }

        #promptInput:focus {
            border-color: var(--primary-color);
        }

        #sendBtn {
            padding: 0 24px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 24px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s, opacity 0.2s;
        }

        #sendBtn:hover {
            background-color: #0056b3;
        }

        #sendBtn:disabled {
            background-color: #a0cbfc;
            cursor: not-allowed;
        }

        /* 简单的打字机闪烁光标效果 */
        .cursor {
            display: inline-block;
            width: 8px;
            height: 16px;
            background-color: #666;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            0%, 100% {
                opacity: 1;
            }
            50% {
                opacity: 0;
            }
        }
    </style>
</head>
<body>

<div class="chat-container">
    <div class="chat-header">
        🤖 Spring AI 流式助手
    </div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot">你好！我是 Spring AI 助手。有什么我可以帮你的吗？</div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="promptInput" placeholder="输入你想问的问题，按回车发送..." autocomplete="off"/>
        <button id="sendBtn">发送</button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    // 生成一个简单的唯一会话 ID
    const chatId = 'chat-' + Math.random().toString(36).substr(2, 9);

    // 格式化换行符
    function escapeHtmlAndNewlines(text) {
        // 先转义 HTML 实体防止 XSS，再将 \n 转换为 <br>
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML.replace(/\n/g, '<br>');
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        msgDiv.innerHTML = escapeHtmlAndNewlines(text);
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return msgDiv;
    }

    async function sendPrompt() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        // 1. 追加用户消息
        appendMessage('user', prompt);
        promptInput.value = '';

        // 2. 禁用输入与按钮
        sendBtn.disabled = true;
        promptInput.disabled = true;

        // 3. 准备接收 AI 回复的容器
        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'message bot';
        botMsgDiv.innerHTML = '<span class="cursor"></span>';
        chatMessages.appendChild(botMsgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        let fullResponse = '';

        try {
            // 4. 使用 fetch 发起 POST 请求 (因为 EventSource 不支持 POST)
            const response = await fetch('/api/ai/stream', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ prompt, chatId })
            });

            if (!response.ok) {
                throw new Error('网络响应错误');
            }

            // 5. 读取流式数据
            const reader = response.body.getReader();
            const decoder = new TextDecoder();

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                // SSE 格式解析: 简单的 data: 内容 处理
                const lines = chunk.split('\n');
                for (const line of lines) {
                    if (line.startsWith('data:')) {
                        const content = line.replace('data:', '').trim();
                        if (content) {
                            fullResponse += content;
                            botMsgDiv.innerHTML = escapeHtmlAndNewlines(fullResponse) + '<span class="cursor"></span>';
                            chatMessages.scrollTop = chatMessages.scrollHeight;
                        }
                    }
                }
            }
        } catch (error) {
            console.error('Error:', error);
            if (!fullResponse) {
                botMsgDiv.innerText = "[发生错误或未收到回复]";
            }
        } finally {
            // 移除光标并恢复输入
            botMsgDiv.innerHTML = escapeHtmlAndNewlines(fullResponse);
            sendBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendPrompt);

    promptInput.addEventListener('keypress', function (e) {
        if (e.key === 'Enter') {
            sendPrompt();
        }
    });
</script>

</body>
</html>
