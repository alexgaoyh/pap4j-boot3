<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spring AI 智能助手 - 增强版</title>
    <!-- 引入 Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- 引入 github-markdown-css 用于渲染 Markdown 样式 -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/github-markdown-css@5.6.1/github-markdown.min.css">
    <!-- 引入 marked 用于解析 Markdown -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <!-- 引入 highlight.js (使用全量或常用语言包) -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11.9.0/highlight.min.js"></script>
    <!-- 引入 KaTeX 数学渲染（LaTeX 公式）：CSS + JS + marked 数学扩展（先 katex JS 后扩展，扩展依赖 global.katex） -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.47/dist/katex.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked-katex-extension@5.1.10/lib/index.umd.js"></script>
    <style>
        body { height: 100vh; margin: 0; display: flex; font-family: sans-serif; }
        .chat-container { flex: 1; display: flex; flex-direction: column; height: 100%; background: #ffffff; }
        .chat-header { padding: 12px 20px; background: linear-gradient(135deg, #4f46e5 0%, #3b82f6 100%); color: white; font-size: 1.2rem; font-weight: bold; }
        .chat-messages { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
        .message { max-width: 80%; padding: 10px 14px; border-radius: 8px; font-size: 0.95rem; line-height: 1.5; }
        .message.user { align-self: flex-end; background-color: #4f46e5; color: white; white-space: pre-wrap; }
        .message.bot { align-self: flex-start; background-color: #f1f5f9; border: 1px solid #e2e8f0; }
        .markdown-body { background-color: transparent !important; font-family: inherit !important; font-size: 0.95rem !important; }
        .markdown-body p:last-child { margin-bottom: 0 !important; }
        .code-block-wrapper { margin: 8px 0; border-radius: 6px; overflow: hidden; background: #282c34; }
        .code-header { display: flex; justify-content: space-between; padding: 4px 8px; background: #21252b; color: #abb2bf; font-size: 0.75rem; }
        .copy-btn { background: transparent; border: 1px solid rgba(255,255,255,0.2); color: #abb2bf; font-size: 0.7rem; border-radius: 3px; cursor: pointer; }
        .code-block-wrapper pre { margin: 0 !important; padding: 10px !important; background: transparent !important; }
        .code-block-wrapper code { background: transparent !important; padding: 0 !important; }
        .chat-input-area { padding: 12px 20px; border-top: 1px solid #e2e8f0; display: flex; gap: 12px; }
        #promptInput { flex: 1; padding: 10px 16px; border: 1px solid #e2e8f0; border-radius: 20px; outline: none; }
        #sendBtn { width: 38px; height: 38px; background-color: #4f46e5; color: white; border: none; border-radius: 50%; cursor: pointer; display: flex; justify-content: center; align-items: center; }
        #sendBtn:disabled { background-color: #e2e8f0; color: #94a3b8; }
        .cursor { display: inline-block; width: 2px; height: 1.2em; background-color: #4f46e5; animation: blink 1s step-end infinite; vertical-align: middle; }
        @keyframes blink { 50% { opacity: 0; } }
    </style>
<body>

<div class="chat-container">
    <div class="chat-header">🤖 Spring AI 智能助手</div>
    <div class="chat-messages" id="chatMessages">
        <div class="message bot"><div class="message-content markdown-body">你好！</div></div>
    </div>
    <div class="chat-input-area">
        <input type="text" id="promptInput" placeholder="输入问题..." autocomplete="off"/>
        <button id="sendBtn"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg></button>
    </div>
</div>

<script>
    const chatMessages = document.getElementById('chatMessages');
    const promptInput = document.getElementById('promptInput');
    const sendBtn = document.getElementById('sendBtn');

    const languageAliasMap = {
        'ql': 'javascript',
        'jsonpath': 'json',
        'expr': 'java',
        'text': 'plaintext'
    };

    function escapeHtml(text) {
        return text
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&#039;");
    }

    // Markdown 预处理器：规范换行符并在表格行（|）与上方未空行的文本块之间自动插入空行
    function preprocessMarkdown(text) {
        if (!text) return '';
        // 1. 规范化所有回车换行符为 \n
        const normalized = text.replace(/\r\n/g, '\n').replace(/\r/g, '\n');
        const lines = normalized.split('\n');
        const processedLines = [];
        
        for (let i = 0; i < lines.length; i++) {
            const currentLine = lines[i];
            const trimmedCurrent = currentLine.trim();
            
            // 如果当前行是以 '|' 开头且前面有一行不是空行、也不以 '|' 开头，则强行加一个空行
            if (trimmedCurrent.startsWith('|')) {
                if (i > 0) {
                    const prevLine = processedLines[processedLines.length - 1];
                    const trimmedPrev = prevLine.trim();
                    if (trimmedPrev !== '' && !trimmedPrev.startsWith('|')) {
                        processedLines.push('');
                    }
                }
            }
            processedLines.push(currentLine);
        }
        return processedLines.join('\n');
    }

    const renderer = new marked.Renderer();
    renderer.code = function(code, language) {
        let codeText = typeof code === 'object' ? (code.text || '') : code;
        let codeLang = typeof code === 'object' ? (code.lang || language) : language;

        if (typeof codeText !== 'string') {
            codeText = String(codeText || '');
        }

        const hasHljs = typeof window.hljs !== 'undefined';
        const targetLang = languageAliasMap[codeLang?.toLowerCase()] || codeLang;
        let highlighted;
        const validLang = !!(hasHljs && targetLang && window.hljs.getLanguage(targetLang));

        try {
            if (validLang && hasHljs) {
                highlighted = window.hljs.highlight(codeText, { language: targetLang }).value;
            } else if (hasHljs) {
                highlighted = window.hljs.highlightAuto(codeText).value;
            } else {
                highlighted = escapeHtml(codeText);
            }
        } catch (e) {
            highlighted = escapeHtml(codeText);
        }

        const displayLang = codeLang || 'text';

        return `
            <div class="code-block-wrapper">
                <div class="code-header">
                    <span>${displayLang}</span>
                    <button class="copy-btn" onclick="copyCode(this)">复制</button>
                </div>
                <pre><code class="hljs ${validLang ? 'language-' + targetLang : ''}">${highlighted}</code></pre>
            </div>
        `;
    };

    marked.use({ renderer: renderer, breaks: true, gfm: true });

    // 注册 KaTeX 数学渲染扩展（tokenizer 级，先于其他 inline 规则整块捕获 $...$ / $$...$$，避免 LaTeX 反斜杠被 marked 转义破坏）
    // throwOnError:false → 流式过程中遇到不完整/非法公式时渲染原文，不抛异常中断聊天
    if (typeof markedKatex !== 'undefined') {
        marked.use(markedKatex({ throwOnError: false }));
    }

    function copyCode(btn) {
        const code = btn.parentElement.nextElementSibling.innerText;
        navigator.clipboard.writeText(code).then(() => {
            const oldText = btn.innerText;
            btn.innerText = '已复制!';
            setTimeout(() => btn.innerText = oldText, 2000);
        });
    }

    function appendMessage(sender, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        const contentDiv = document.createElement('div');
        contentDiv.className = sender === 'bot' ? 'message-content markdown-body' : 'message-content';
        if (sender === 'bot') contentDiv.innerHTML = marked.parse(preprocessMarkdown(text));
        else contentDiv.textContent = text;
        msgDiv.appendChild(contentDiv);
        chatMessages.appendChild(msgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return contentDiv;
    }

    const chatId = 'chat-' + Math.random().toString(36).substr(2, 9);

    async function sendPrompt() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        appendMessage('user', prompt);
        promptInput.value = '';
        sendBtn.disabled = true;
        promptInput.disabled = true;

        const botMsgDiv = document.createElement('div');
        botMsgDiv.className = 'message bot';
        const botContentDiv = document.createElement('div');
        botContentDiv.className = 'message-content markdown-body';
        botContentDiv.innerHTML = '<span class="cursor"></span>';
        botMsgDiv.appendChild(botContentDiv);
        chatMessages.appendChild(botMsgDiv);
        chatMessages.scrollTop = chatMessages.scrollHeight;

        let fullResponse = '';

        try {
            const response = await fetch('/api/ai/stream', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prompt, chatId })
            });
            if (!response.ok) throw new Error('网络请求失败');

            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = '';
            let eventLines = [];
            let hasData = false;

            // 完美的流式行和多行事件缓冲区解析，符合 W3C SSE 规范，确保还原 Markdown 换行与表格
            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value, { stream: true });

                let lineIndex;
                while ((lineIndex = buffer.indexOf('\n')) !== -1) {
                    const line = buffer.slice(0, lineIndex);
                    buffer = buffer.slice(lineIndex + 1);

                    // 兼容 Windows 系统的回车符 \r
                    const cleanLine = line.replace(/\r$/, '');
                    if (cleanLine.startsWith('data:')) {
                        hasData = true;
                        let content = cleanLine.slice(5);
                        if (content.startsWith(' ')) {
                            content = content.slice(1);
                        }
                        try {
                            const parsed = JSON.parse(content);
                            eventLines.push(parsed.v);
                        } catch (e) {
                            eventLines.push(content);
                        }
                    } else if (cleanLine === '') {
                        if (hasData) {
                            // 一个完整的 SSE 事件块结束，将其包含的行拼接加入 fullResponse
                            fullResponse += eventLines.join('\n');
                            eventLines = [];
                            hasData = false;
                        }
                    }
                }

                // 实时打字机渲染（包含当前正在拼接缓冲的数据，提供流畅的打字效果）
                const tempResponse = fullResponse + (hasData ? eventLines.join('\n') : '');
                botContentDiv.innerHTML = marked.parse(preprocessMarkdown(tempResponse)) + '<span class="cursor"></span>';
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }

            // 处理流结束后的可能残余缓冲区数据
            if (buffer.length > 0) {
                const cleanLine = buffer.replace(/\r$/, '');
                if (cleanLine.startsWith('data:')) {
                    hasData = true;
                    let content = cleanLine.slice(5);
                    if (content.startsWith(' ')) {
                        content = content.slice(1);
                    }
                    try {
                        const parsed = JSON.parse(content);
                        eventLines.push(parsed.v);
                    } catch (e) {
                        eventLines.push(content);
                    }
                }
            }
            if (hasData && eventLines.length > 0) {
                fullResponse += eventLines.join('\n');
                eventLines = [];
                hasData = false;
            }

        } catch (error) {
            botContentDiv.innerHTML = "错误: " + error.message;
        } finally {
            botContentDiv.innerHTML = marked.parse(preprocessMarkdown(fullResponse));
            sendBtn.disabled = false;
            promptInput.disabled = false;
            promptInput.focus();
        }
    }

    sendBtn.addEventListener('click', sendPrompt);
    promptInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') sendPrompt(); });
</script>

</body>
</html>
